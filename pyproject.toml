[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "consonance"
version = "0.1.0"
description = "A local MIDI piano practice companion for Windows 11"
requires-python = ">=3.12"
license = "0BSD"
dependencies = ["PySide6>=6.8,<7", "mido>=1.3,<2", "python-rtmidi>=1.5,<2", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.14", "ruff>=0.9"]

[project.scripts]
consonance = "consonance.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["mido", "mido.*", "rtmidi", "rtmidi.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["consonance.core.notation.KeySignature", "consonance.core.notation.TimeSignature"]
